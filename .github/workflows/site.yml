# Every pull request: validate, lint, build, check links, run the slice tests and
# the site-wide checks, and save screenshots of every page for review.
# Every push to main: the same, then publish _site/ to GitHub Pages.
# If any check fails, nothing is published.
#
# main only accepts pull requests whose two jobs below pass: "Validate, build,
# check links and test" (which also lints) and "Site-wide checks". Renaming a
# job means updating the branch protection rule on main to match.
name: Site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  # A newer push to a pull request supersedes the older run; publishing from
  # main always finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Validate, build, check links and test
    runs-on: ubuntu-latest
    # Playwright's own image, with the test browsers and their system packages
    # already installed; downloading them on every run took up to 24 minutes.
    # Its version must equal @playwright/test's in package-lock.json: after a
    # Playwright upgrade change it here too, or the tests stop with "Executable
    # doesn't exist". `--user 1001` is the user GitHub's own steps run as.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run lint
      - run: npm run build
      - run: npm run linkcheck
      - run: npm test
      - name: Keep the test report when tests fail
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  site-checks:
    name: Site-wide checks
    runs-on: ubuntu-latest
    # The same image as the job above, for the same reason.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run test:site
      - name: Keep the test report when checks fail
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: site-checks-report
          path: |
            playwright-report-site/
            test-results-site/
          retention-days: 14
      - name: Save screenshots of every page for review
        if: success() || failure()
        run: npm run shots
      - if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: .shots/
          retention-days: 14

  deploy:
    name: Publish to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, site-checks]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
